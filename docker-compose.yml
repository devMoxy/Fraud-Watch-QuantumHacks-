services:
  postgres:
    image: postgres:16-alpine
    container_name: fraudwatch-postgres
    environment:
      POSTGRES_DB: fraudwatch
      POSTGRES_USER: fraudwatch
      POSTGRES_PASSWORD: fraudwatch
    ports:
      - "5432:5432"
    volumes:
      - fraudwatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fraudwatch-pgdata:
